<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Full Sidebar Motion Demo</title>
  <style>
    @font-face {
      font-family: "Aeonik Pro";
      src: url("assets/fonts/AeonikProTRIAL-Regular.otf") format("opentype");
      font-style: normal;
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: "Aeonik Pro";
      src: url("assets/fonts/AeonikProTRIAL-Bold.otf") format("opentype");
      font-style: normal;
      font-weight: 700;
      font-display: swap;
    }
    html { color-scheme: dark; background: #0b0d10; }
    body { margin: 0; min-width: 320px; background: #0b0d10; }
  </style>
</head>
<body>
<section id="full-sidebar-motion" aria-label="Интерактивная демка полного сайдбара">
  <style>
    #full-sidebar-motion {
      --sb-bg: #121418;
      --sb-surface: #212329;
      --sb-hover: #191b1f;
      --sb-border: #282a33;
      --sb-text: #f0f2f5;
      --sb-muted: #9a9fa9;
      --sb-active: #8771fa;
      --sb-yellow: #fac34a;
      display: grid;
      place-items: start center;
      width: 100%;
      padding: 16px 0;
      box-sizing: border-box;
      color: var(--sb-text);
      background: transparent;
      font-family: "Aeonik Pro", Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #full-sidebar-motion * { box-sizing: border-box; }

    #full-sidebar-motion .sb-panel {
      width: 280px;
      min-height: 1455px;
      overflow: hidden;
      border-right: 1px solid var(--sb-border);
      background: var(--sb-bg);
    }

    #full-sidebar-motion button,
    #full-sidebar-motion input {
      font: inherit;
    }

    #full-sidebar-motion .sb-top,
    #full-sidebar-motion .sb-search-wrap {
      height: 76px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--sb-border);
    }

    #full-sidebar-motion .sb-top {
      display: grid;
      grid-template-columns: 24px 1fr;
      align-items: center;
      gap: 12px;
    }

    #full-sidebar-motion .sb-burger {
      display: grid;
      width: 24px;
      height: 24px;
      padding: 3px 2px;
      border: 0;
      background: transparent;
      color: #969ca7;
      cursor: pointer;
    }

    #full-sidebar-motion .sb-burger span {
      display: block;
      align-self: center;
      width: 20px;
      height: 2px;
      border-radius: 2px;
      background: currentColor;
      transition: transform 160ms ease;
    }

    #full-sidebar-motion .sb-burger:hover span:first-child { transform: translateX(2px); }
    #full-sidebar-motion .sb-burger:hover span:last-child { transform: translateX(-2px); }

    #full-sidebar-motion .sb-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      height: 44px;
    }

    #full-sidebar-motion .sb-tab {
      border: 1px solid var(--sb-border);
      border-radius: 8px;
      background: var(--sb-surface);
      color: var(--sb-text);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background 160ms ease, border-color 160ms ease;
    }

    #full-sidebar-motion .sb-tab:hover { background: #292b32; }
    #full-sidebar-motion .sb-tab.is-active {
      border-color: #7628ff;
      background: #7628ff;
    }
    #full-sidebar-motion .sb-tab.is-active:hover { background: #7628ff; }

    #full-sidebar-motion .sb-search {
      display: grid;
      grid-template-columns: 24px 1fr;
      align-items: center;
      gap: 12px;
      height: 44px;
      padding: 0 16px;
      border: 1px solid var(--sb-border);
      border-radius: 8px;
      background: var(--sb-surface);
      color: var(--sb-muted);
    }

    #full-sidebar-motion .sb-search svg { width: 24px; height: 24px; }
    #full-sidebar-motion .sb-search input {
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--sb-text);
      font-size: 14px;
    }
    #full-sidebar-motion .sb-search input::placeholder { color: #c8cbd2; opacity: 1; }

    #full-sidebar-motion .sb-promos { height: 123px; border-bottom: 1px solid var(--sb-border); }
    #full-sidebar-motion .sb-promo-wheel { height: 68px; padding: 12px 20px; }
    #full-sidebar-motion .sb-promo-split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      height: 55px;
      border-top: 1px solid var(--sb-border);
    }
    #full-sidebar-motion .sb-promo-split > :first-child { border-right: 1px solid var(--sb-border); }

    #full-sidebar-motion .sb-promo-row {
      display: grid;
      grid-template-columns: 32px minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      width: 100%;
      height: 44px;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--sb-text);
      text-align: left;
      cursor: pointer;
    }
    #full-sidebar-motion .sb-promo-split .sb-promo-row {
      grid-template-columns: 32px minmax(0, 1fr);
      height: 54px;
      padding: 0 20px;
    }
    #full-sidebar-motion .sb-promo-row img { display: block; width: 32px; height: 32px; object-fit: contain; }
    #full-sidebar-motion .sb-promo-row span { overflow: hidden; font-size: 14px; white-space: nowrap; text-overflow: ellipsis; }
    #full-sidebar-motion .sb-promo-row:hover img { animation: sb-promo-pop .8s cubic-bezier(.2,.8,.3,1) both; }

    #full-sidebar-motion .sb-top-badge,
    #full-sidebar-motion .sb-support-badge {
      display: grid;
      place-items: center;
      height: 20px;
      border-radius: 5px;
      font-size: 11px;
      font-weight: 500;
      line-height: 20px;
    }
    #full-sidebar-motion .sb-top-badge { width: 37px; background: var(--sb-active); color: white; }
    #full-sidebar-motion .sb-support-badge { width: 39px; background: var(--sb-yellow); color: #121418; }

    #full-sidebar-motion .sb-section { border-bottom: 1px solid var(--sb-border); }
    #full-sidebar-motion .sb-section-main { padding: 10px 0; }
    #full-sidebar-motion .sb-section-single { padding: 10px 0; }
    #full-sidebar-motion .sb-section-casino { padding: 10px 0; }
    #full-sidebar-motion .sb-section-bottom { padding: 10px 0; border-bottom: 0; }

    #full-sidebar-motion .sb-row {
      position: relative;
      display: grid;
      grid-template-columns: 24px minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      width: 100%;
      height: 48px;
      min-height: 48px;
      padding: 10px 20px;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: var(--sb-text);
      text-align: left;
      cursor: pointer;
      appearance: none;
    }

    #full-sidebar-motion .sb-row::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      background: transparent;
      transition: background-color 160ms ease;
    }
    #full-sidebar-motion .sb-row:is(:hover, :focus-visible)::before { background: var(--sb-hover); }
    #full-sidebar-motion .sb-row > * { position: relative; z-index: 1; }
    #full-sidebar-motion .sb-row.is-active { color: var(--sb-active); }
    #full-sidebar-motion .sb-row.is-active::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 3px;
      border-radius: 0 3px 3px 0;
      background: var(--sb-active);
    }

    #full-sidebar-motion .sb-label {
      overflow: hidden;
      font-size: 14px;
      font-weight: 400;
      line-height: 20px;
      letter-spacing: .12px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #full-sidebar-motion .sb-icon {
      display: grid;
      place-items: center;
      width: 24px;
      height: 24px;
      color: currentColor;
    }
    #full-sidebar-motion .sb-icon > svg { display: block; width: 24px; height: 24px; overflow: visible; }
    #full-sidebar-motion .sb-icon > img { display: block; width: 24px; height: 24px; object-fit: contain; }
    #full-sidebar-motion .sb-icon.profile-transfer-icon > img { width: 20px; height: 20px; }
    #full-sidebar-motion .sb-icon.icon-20 > svg { width: 20px; height: 20px; }
    #full-sidebar-motion .sb-icon svg [fill="#F0F2F5"] { fill: currentColor; }
    #full-sidebar-motion .sb-icon svg [stroke="#F0F2F5"] { stroke: currentColor; }

    #full-sidebar-motion .sb-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--sb-yellow); }
    #full-sidebar-motion .sb-chevron {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      margin: -4px 0;
      border-radius: 8px;
      background: var(--sb-surface);
      color: #969ca7;
      transition: background-color 160ms ease;
    }
    #full-sidebar-motion .sb-chevron svg { width: 20px; height: 20px; }
    #full-sidebar-motion .sb-chevron:hover { background: #2a2e38; }

    #full-sidebar-motion .sb-accordion { padding: 10px 0; }
    #full-sidebar-motion .sb-accordion-trigger .sb-chevron svg {
      transition: transform 280ms cubic-bezier(.2,.75,.25,1);
      transform-origin: center;
    }
    #full-sidebar-motion .sb-accordion.is-open > .sb-accordion-trigger { color: var(--sb-active); }
    #full-sidebar-motion .sb-accordion.is-open > .sb-accordion-trigger .sb-chevron svg { transform: rotate(180deg); }
    #full-sidebar-motion .sb-accordion-panel {
      display: grid;
      grid-template-rows: 0fr;
      background: transparent;
      transition: grid-template-rows 320ms cubic-bezier(.2,.75,.25,1), background-color 180ms ease;
    }
    #full-sidebar-motion .sb-accordion.is-open > .sb-accordion-panel { grid-template-rows: 1fr; }
    #full-sidebar-motion .sb-accordion-inner {
      min-height: 0;
      overflow: hidden;
      visibility: hidden;
      transition: visibility 0s linear 320ms;
    }
    #full-sidebar-motion .sb-accordion.is-open > .sb-accordion-panel > .sb-accordion-inner {
      visibility: visible;
      transition-delay: 0s;
    }
    #full-sidebar-motion .sb-promotions-accordion.is-open,
    #full-sidebar-motion .sb-profile-accordion.is-open { background: #080808; }
    #full-sidebar-motion .sb-promotions-accordion .sb-accordion-subrow,
    #full-sidebar-motion .sb-profile-accordion .sb-accordion-subrow {
      padding-right: 20px;
      padding-left: 32px;
    }
    #full-sidebar-motion .sb-accordion-subrow .sb-icon > svg { overflow: visible; }

    @media (prefers-reduced-motion: reduce) {
      #full-sidebar-motion .sb-accordion-panel,
      #full-sidebar-motion .sb-accordion-trigger .sb-chevron svg { transition-duration: 1ms; }
    }

    #full-sidebar-motion .sb-winum-stage {
      display: grid;
      place-items: center;
      width: 24px;
      height: 24px;
      perspective: 120px;
    }
    #full-sidebar-motion .sb-winum-icon {
      position: relative;
      display: block;
      width: 24px;
      height: 24px;
      transform-style: preserve-3d;
      will-change: transform;
    }
    #full-sidebar-motion .sb-winum-face {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      border: 1px solid #686868;
      border-radius: 50%;
      background: radial-gradient(circle at 38% 32%, #626262 0 16%, #2b2b2b 52%, #0d0d0d 100%);
      box-shadow: inset 0 0 0 1px #171717;
      overflow: hidden;
      color: #f0f2f5;
      font-size: 7px;
      font-weight: 700;
      font-style: italic;
      letter-spacing: -.7px;
      backface-visibility: hidden;
    }
    #full-sidebar-motion .sb-winum-back { transform: rotateY(180deg); }
    #full-sidebar-motion .sb-winum-shine {
      position: absolute;
      inset: -7px;
      width: 7px;
      height: 38px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.58), transparent);
      opacity: 0;
      transform: translateX(-16px) rotate(22deg);
      pointer-events: none;
    }
    #full-sidebar-motion .sb-row:is(:hover, :focus-visible) .sb-winum-icon { animation: sb-winum-flip 1s cubic-bezier(.2,.72,.22,1) both; }
    #full-sidebar-motion .sb-row:is(:hover, :focus-visible) .sb-winum-shine { animation: sb-winum-shine 1s cubic-bezier(.2,.8,.3,1) both; }

    #full-sidebar-motion .home-shell,
    #full-sidebar-motion .home-door,
    #full-sidebar-motion .heart-shape,
    #full-sidebar-motion .new-badge-shape,
    #full-sidebar-motion .clock-minute,
    #full-sidebar-motion .clock-hour,
    #full-sidebar-motion .gift-box,
    #full-sidebar-motion .gift-top,
    #full-sidebar-motion .sb-icon svg path,
    #full-sidebar-motion .sb-icon svg g {
      transform-box: view-box;
    }
    #full-sidebar-motion .new-letter { transform-box: fill-box; transform-origin: center; }

    #full-sidebar-motion .sb-row:is(:hover, :focus-visible) .home-shell { animation: sb-home-hop 1.1s cubic-bezier(.22,.82,.32,1) both; transform-origin: 12px 13px; }
    #full-sidebar-motion .sb-row:is(:hover, :focus-visible) .home-door { animation: sb-home-door 1.1s cubic-bezier(.22,.82,.32,1) both; transform-origin: 12px 17px; }
    #full-sidebar-motion .sb-row:is(:hover, :focus-visible) .heart-shape { animation: sb-heart-lift 1.25s cubic-bezier(.2,.78,.32,1) both; transform-origin: 12px 12px; }
    #full-sidebar-motion .sb-row:is(:hover, :focus-visible) .new-badge-shape { animation: sb-new-pulse 1.3s cubic-bezier(.2,.76,.34,1) both; transform-origin: 10px 10px; }
    #full-sidebar-motion .sb-row:is(:hover, :focus-visible) .new-letter { animation: sb-new-type 1.08s cubic-bezier(.2,.8,.3,1) both; }
    #full-sidebar-motion .sb-row:is(:hover, :focus-visible) .new-letter-n { animation-delay: 70ms; }
    #full-sidebar-motion .sb-row:is(:hover, :focus-visible) .new-letter-e { animation-delay: 125ms; }
    #full-sidebar-motion .sb-row:is(:hover, :focus-visible) .new-letter-w { animation-delay: 180ms; }
    #full-sidebar-motion .sb-row:is(:hover, :focus-visible) .clock-minute { animation: sb-clock-minute .95s cubic-bezier(.25,.7,.2,1) both; transform-origin: 12px 12px; }
    #full-sidebar-motion .sb-row:is(:hover, :focus-visible) .clock-hour { animation: sb-clock-hour 1.2s cubic-bezier(.28,.72,.24,1) both; transform-origin: 12px 12px; }
    #full-sidebar-motion .sb-row:is(:hover, :focus-visible) .gift-top { animation: sb-gift-top 1.35s cubic-bezier(.2,.86,.32,1) both; transform-origin: 12px 12px; }
    #full-sidebar-motion .sb-row:is(:hover, :focus-visible) .gift-box { animation: sb-gift-box 1.35s cubic-bezier(.2,.86,.32,1) both; transform-origin: 12px 22px; }

    #full-sidebar-motion .i-cash svg > g > path:nth-of-type(1) { transform-origin: 10px 10px; }
    #full-sidebar-motion .i-cash svg > g > path:nth-of-type(2) { transform-origin: 14px 14px; }
    #full-sidebar-motion .i-cash svg > g > path:nth-of-type(3) { transform-origin: 14px 14px; }
    #full-sidebar-motion .i-cash svg > g > path:nth-of-type(4),
    #full-sidebar-motion .i-cash svg > g > path:nth-of-type(5) { transform-origin: 19px 19px; }
    #full-sidebar-motion .sb-row:is(:hover, :focus-visible) .i-cash svg > g > path:nth-of-type(1) { animation: sb-card-back 1.1s cubic-bezier(.2,.8,.3,1) both; }
    #full-sidebar-motion .sb-row:is(:hover, :focus-visible) .i-cash svg > g > path:nth-of-type(2) { animation: sb-card-front 1.1s cubic-bezier(.2,.8,.3,1) both; }
    #full-sidebar-motion .sb-row:is(:hover, :focus-visible) .i-cash svg > g > path:nth-of-type(3) { animation: sb-coin-pop 1.1s cubic-bezier(.2,.8,.3,1) both; }
    #full-sidebar-motion .sb-row:is(:hover, :focus-visible) .i-cash svg > g > path:nth-of-type(4),
    #full-sidebar-motion .sb-row:is(:hover, :focus-visible) .i-cash svg > g > path:nth-of-type(5) { animation: sb-plus-turn 1.1s cubic-bezier(.2,.8,.3,1) both; }

    #full-sidebar-motion .i-lobby svg > path { transform-origin: center; }
    #full-sidebar-motion .sb-row:is(:hover, :focus-visible) .i-lobby svg > path { animation: sb-tile-pop .9s cubic-bezier(.2,.8,.3,1) both; }
    #full-sidebar-motion .sb-row:is(:hover, :focus-visible) .i-lobby svg > path:nth-of-type(2) { animation-delay: 55ms; }
    #full-sidebar-motion .sb-row:is(:hover, :focus-visible) .i-lobby svg > path:nth-of-type(3) { animation-delay: 110ms; }
    #full-sidebar-motion .sb-row:is(:hover, :focus-visible) .i-lobby svg > path:nth-of-type(1) { animation-delay: 165ms; }


    #full-sidebar-motion .i-slots svg > g > path { transform-origin: 12px 12px; }
    #full-sidebar-motion .sb-row:is(:hover, :focus-visible) .i-slots svg > g > path:first-of-type { animation: sb-cone-kick 1.05s cubic-bezier(.2,.82,.3,1) both; }
    #full-sidebar-motion .sb-row:is(:hover, :focus-visible) .i-slots svg > g > path:nth-of-type(n+2) { animation: sb-confetti 1.05s cubic-bezier(.2,.82,.3,1) both; }
    #full-sidebar-motion .sb-row:is(:hover, :focus-visible) .i-slots svg > g > path:nth-of-type(3) { animation-delay: 45ms; }
    #full-sidebar-motion .sb-row:is(:hover, :focus-visible) .i-slots svg > g > path:nth-of-type(4) { animation-delay: 85ms; }
    #full-sidebar-motion .sb-row:is(:hover, :focus-visible) .i-slots svg > g > path:nth-of-type(5) { animation-delay: 125ms; }
    #full-sidebar-motion .sb-row:is(:hover, :focus-visible) .i-slots svg > g > path:nth-of-type(6) { animation-delay: 165ms; }
    #full-sidebar-motion .sb-row:is(:hover, :focus-visible) .i-slots svg > g > path:nth-of-type(7) { animation-delay: 205ms; }

    #full-sidebar-motion .sb-row:is(:hover, :focus-visible) .i-live svg > g > path {
      animation: sb-suit 1.15s cubic-bezier(.2,.8,.3,1) both;
      transform-origin: 12px 18px;
    }

    #full-sidebar-motion .i-blackjack .blackjack-back-card,
    #full-sidebar-motion .i-blackjack .blackjack-front-card {
      transform-box: view-box;
      transform-origin: 12px 18px;
    }
    #full-sidebar-motion .sb-row:is(:hover, :focus-visible) .i-blackjack .blackjack-back-card {
      animation: sb-card-right 1.15s cubic-bezier(.2,.8,.3,1) both;
    }
    #full-sidebar-motion .sb-row:is(:hover, :focus-visible) .i-blackjack .blackjack-front-card {
      animation: sb-card-left 1.15s cubic-bezier(.2,.8,.3,1) both;
    }

    #full-sidebar-motion .sb-row:is(:hover, :focus-visible) .i-roulette svg > g { animation: sb-wheel 1.2s cubic-bezier(.2,.74,.28,1) both; transform-origin: 10px 10px; }

    #full-sidebar-motion .i-show svg > g > path { transform-origin: 10px 10px; }
    #full-sidebar-motion .sb-row:is(:hover, :focus-visible) .i-show svg > g > path:first-of-type { animation: sb-screen 1.05s cubic-bezier(.2,.8,.3,1) both; }
    #full-sidebar-motion .sb-row:is(:hover, :focus-visible) .i-show svg > g > path:nth-of-type(2) { animation: sb-dollar 1.05s cubic-bezier(.2,.8,.3,1) both; }
    #full-sidebar-motion .sb-row:is(:hover, :focus-visible) .i-show svg > g > path:nth-of-type(3) { animation: sb-stand 1.05s cubic-bezier(.2,.8,.3,1) both; }

    #full-sidebar-motion .sb-row:is(:hover, :focus-visible) .i-fast svg > path:first-of-type { animation: sb-bolt 1s cubic-bezier(.2,.8,.3,1) both; transform-origin: 10px 10px; }

    #full-sidebar-motion .i-plinko svg > path { transform-origin: center; }
    #full-sidebar-motion .sb-row:is(:hover, :focus-visible) .i-plinko svg > path { animation: sb-plinko 1.05s cubic-bezier(.2,.8,.3,1) both; }
    #full-sidebar-motion .sb-row:is(:hover, :focus-visible) .i-plinko svg > path:nth-of-type(2),
    #full-sidebar-motion .sb-row:is(:hover, :focus-visible) .i-plinko svg > path:nth-of-type(3) { animation-delay: 65ms; }
    #full-sidebar-motion .sb-row:is(:hover, :focus-visible) .i-plinko svg > path:nth-of-type(n+4) { animation-delay: 130ms; }

    #full-sidebar-motion .sb-row:is(:hover, :focus-visible) .i-providers svg > g > path { animation: sb-flag 1.25s cubic-bezier(.2,.8,.3,1) both; transform-origin: 5px 12px; }

    #full-sidebar-motion .i-profile svg > g > path:first-of-type { transform-origin: 12px 7px; }
    #full-sidebar-motion .i-profile svg > g > path:nth-of-type(2) { transform-origin: 12px 22px; }
    #full-sidebar-motion .sb-row:is(:hover, :focus-visible) .i-profile svg > g > path:first-of-type { animation: sb-profile-head 1.05s cubic-bezier(.2,.8,.3,1) both; }
    #full-sidebar-motion .sb-row:is(:hover, :focus-visible) .i-profile svg > g > path:nth-of-type(2) { animation: sb-profile-body 1.05s cubic-bezier(.2,.8,.3,1) both; }

    #full-sidebar-motion .i-vip svg > path { transform-origin: center; }
    #full-sidebar-motion .sb-row:is(:hover, :focus-visible) .i-vip svg > path { animation: sb-vip-letter 1.05s cubic-bezier(.2,.8,.3,1) both; }
    #full-sidebar-motion .sb-row:is(:hover, :focus-visible) .i-vip svg > path:nth-of-type(2) { animation-delay: 75ms; }
    #full-sidebar-motion .sb-row:is(:hover, :focus-visible) .i-vip svg > path:nth-of-type(1) { animation-delay: 150ms; }

    #full-sidebar-motion .i-loyalty .loyalty-left-person,
    #full-sidebar-motion .i-loyalty .loyalty-dollar {
      transform-box: view-box;
      transform-origin: 7px 12px;
    }
    #full-sidebar-motion .i-loyalty .loyalty-dollar {
      transform: translateX(-7.884px);
    }
    #full-sidebar-motion .sb-row:is(:hover, :focus-visible) .i-loyalty .loyalty-left-person {
      animation: sb-loyalty-person .85s cubic-bezier(.2,.8,.3,1) both;
    }
    #full-sidebar-motion .sb-row:is(:hover, :focus-visible) .i-loyalty .loyalty-dollar {

  <script>
    (() => {
      const root = document.getElementById('full-sidebar-motion');
      if (!root) return;

      const accordions = [...root.querySelectorAll('.sb-accordion')];
      const setAccordionState = (section, open) => {
        const trigger = section.querySelector(':scope > .sb-accordion-trigger');
        const panel = section.querySelector(':scope > .sb-accordion-panel');
        section.classList.toggle('is-open', open);
        trigger?.setAttribute('aria-expanded', String(open));
        panel?.setAttribute('aria-hidden', String(!open));
        if (panel) panel.inert = !open;
      };

      accordions.forEach((section) => {
        setAccordionState(section, section.classList.contains('is-open'));
        section.querySelector(':scope > .sb-accordion-trigger')?.addEventListener('click', () => {
          const willOpen = !section.classList.contains('is-open');
          accordions.forEach((item) => setAccordionState(item, item === section && willOpen));
        });
      });

      root.querySelectorAll('.sb-row').forEach((row) => {
        if (row.classList.contains('sb-accordion-trigger')) return;
        row.addEventListener('click', () => {
          root.querySelectorAll('.sb-row.is-active').forEach((active) => active.classList.remove('is-active'));
          row.classList.add('is-active');
        });
      });
    })();
  </script>

        const oriented=Math.sign(area(points))===direction?points.slice():points.slice().reverse();
        let best=0,nearest=Infinity;
        oriented.forEach((p,i)=>{const d=(p[0]-anchor[0])**2+(p[1]-anchor[1])**2;if(d<nearest){nearest=d;best=i;}});
        return oriented.slice(best).concat(oriented.slice(0,best));
      }
      function path(points) { return 'M'+points.map(p=>p[0].toFixed(3)+' '+p[1].toFixed(3)).join('L')+'Z'; }
      function ease(t) { return t*t*(3-2*t); }
      const rawCloth=sample(clothStates.a), clothDirection=Math.sign(area(rawCloth))||1;
      const rawPole=sample(poleStates.a), poleDirection=Math.sign(area(rawPole))||1;
      const data={
        a:normalize(rawCloth,clothDirection,[3.98,4.89]),
        b:normalize(sample(clothStates.b),clothDirection,[3.98,4.89]),
        c:normalize(sample(clothStates.c),clothDirection,[3.98,4.89]),
        pole:{a:normalize(rawPole,poleDirection,[3.98,21.01]),b:normalize(sample(poleStates.b),poleDirection,[3.98,21.01])}
      };
      cloth.setAttribute('d',path(data.a));
      pole.setAttribute('d',path(data.pole.a));

      function play() {
        if (matchMedia('(prefers-reduced-motion:reduce)').matches) return;
        const token=++run, started=performance.now();
        function frame(now) {
          if(token!==run)return;
          const progress=Math.min(1,(now-started)/sequence.duration);
          let segment=sequence.stops.length-2;
          for(let i=0;i<sequence.stops.length-1;i+=1){if(progress<=sequence.stops[i+1]){segment=i;break;}}
          const local=ease((progress-sequence.stops[segment])/(sequence.stops[segment+1]-sequence.stops[segment]));
          const from=data[sequence.keys[segment]],to=data[sequence.keys[segment+1]];
          cloth.setAttribute('d',path(from.map((p,i)=>[p[0]+(to[i][0]-p[0])*local,p[1]+(to[i][1]-p[1])*local])));
          const pk1=sequence.keys[segment]==='b'?'b':'a',pk2=sequence.keys[segment+1]==='b'?'b':'a';
          const pf=data.pole[pk1],pt=data.pole[pk2];
          pole.setAttribute('d',path(pf.map((p,i)=>[p[0]+(pt[i][0]-p[0])*local,p[1]+(pt[i][1]-p[1])*local])));
          if(progress<1)requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
      }
      row.addEventListener('pointerenter',play);
      row.addEventListener('focus',play);
    })();
  </script>
